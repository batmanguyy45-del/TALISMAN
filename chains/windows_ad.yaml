name: windows_ad
version: "1.0"
description: "Active Directory assessment placeholder — direct LDAP, Kerberos and SMB transports are disabled until scope-safe implementations are available"
tags: [activedirectory, windows, kerberos, smb]
rate_profile: stealth

steps:
  - id: ad_recon
    module: ad.recon
    args:
      collect: [users, groups, computers, spns, asrep]

  - id: smb_audit
    module: ad.smb
    parallel: true
    args:
      enum_shares: true
      null_session: true
      signing_check: true
