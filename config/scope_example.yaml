# Example scope file — pass with --scope flag
include:
  - "*.example.com"
  - "example.com"
  - "192.168.1.0/24"

exclude:
  - "mail.example.com"
  - "*.prod.example.com"

restrictions:
  max_requests_per_second: 2
  avoid_writes: false
  allow_state_changing_requests: false
  avoid_destructive: true
  respect_robots_txt: false
